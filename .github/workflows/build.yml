name: Build APK Fenix
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git python3-dev python3-pip \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev

      - name: Instalar paquetes Python
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "cython<3.0.0"
          python3 -m pip install buildozer

      - name: Crear configuración
        run: |
          cat > buildozer.spec << 'EOF'
[app]
title = FenixDecryptor
package.name = fenixdecryptor
package.domain = org.fenix
source.dir = .
version = 1.0
requirements = python3,pycryptodome
android.api = 34
android.ndk = 25b
android.permissions = INTERNET
android.accept_all_licenses = True
android.ndk_api = 21
android.archs = arm64-v8a
EOF

      - name: Compilar APK
        run: buildozer android debug
        timeout-minutes: 60

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FenixDecryptor-APK
          path: bin/*.apk
