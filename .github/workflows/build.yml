name: Build APK Fenix
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar paquetes
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-dev python3-pip \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user "cython<3.0"
          python3 -m pip install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configurar Buildozer
        run: |
          cat > buildozer.spec << 'EOF'
[app]
title = FenixDecryptor
package.name = fenixdecryptor
package.domain = org.fenix
source.dir = .
version = 1.0
requirements = python3,pycryptodome
android.api = 33
android.ndk = 25b
android.sdk = 24
android.build_tools_version = 34.0.0
android.permissions = INTERNET
android.accept_all_licenses = True
android.ndk_api = 21
android.archs = arm64-v8a
EOF

      - name: Compilar APK
        run: buildozer android debug
        timeout-minutes: 60

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: FenixDecryptor-APK
          path: bin/*.apk
